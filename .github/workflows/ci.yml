name: CI

# The repo had no CI. This is the gate that makes every other improvement
# stick: the authorization pass, the doc alignment and any future refactor are
# only trustworthy if a machine re-checks them on every push.
on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json requires node >= 22.5.0 (node:sqlite is used directly)
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Lint runs before the tests: it is the cheapest signal, and `--max-warnings`
      # makes it a ratchet — new warnings fail the build, existing debt does not.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
