version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic
      POSTGRES_DB: agentic
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://agentic:agentic@postgres:5432/agentic
      REDIS_URL: redis://redis:6379
      PORT: "4000"
      CORS_ORIGIN: http://localhost:3000
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AGENTIC_API_URL: http://api:4000
      NODE_ENV: production
    command: ["node", "apps/web/node_modules/next/dist/bin/next", "start", "-p", "3000", "-H", "0.0.0.0"]
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
